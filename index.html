
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <header>
        <h1>Calculadora de Média</h1>
    </header>

    <main>
        <section>
            <h2>Dados do aluno</h2>
            <form id="notas">

                <div id="nomealuno">
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome"
                        placeholder="Nome do aluno" required>
                </div>

                <div class="notas">
                    <label for="nota1">Nota 1</label>
                    <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="Nota 1" required>
                </div>

                <div class="notas">
                    <label for="nota2">Nota 2</label>
                    <input type="number" id="nota2" min="0" max="10" step="0.1"placeholder="Nota 2" required>
                                 </div>

                <div class="notas">
                    <label for="nota3">Nota 3</label>
                    <input type="number" id="nota3"min="0" max="10" step="0.1"placeholder="Nota 3" required>
                </div>

                <div class="notas">
                    <label for="nota4">Nota 4</label>
                    <input type="number" id="nota4"min="0" max="10" step="0.1"placeholder="Nota 4" required>
                </div>

                <button type="submit" id="btn">
                    <strong>Calcular</strong>
                </button>

            </form>
            <div id="resultado"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
